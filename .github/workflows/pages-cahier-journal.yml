name: Déployer le Cahier Journal (GitHub Pages)

# Publie l'application cahier-journal/ sur GitHub Pages.
# Le site ne sert que le CODE de l'app : les données saisies restent
# stockées localement (IndexedDB) dans le navigateur de chaque visiteur.

on:
  push:
    branches: [claude/cahier-journal-app-tjfewn]
    paths:
      - "cahier-journal/**"
      - ".github/workflows/pages-cahier-journal.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cahier-journal/package-lock.json
      - name: Installer les dépendances
        working-directory: cahier-journal
        run: npm ci
      - name: Compiler l'application
        working-directory: cahier-journal
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cahier-journal/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
